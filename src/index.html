<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Archive Ocellus Trainer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: black;
        color: white;
        font-family: sans-serif;
      }

      canvas {
        image-rendering: pixelated;
      }

      #credit_line {
        position: absolute;
        bottom: 4px;
        left: 4px;
        max-width: 60ch;
        margin: 0;
        font-size: 12px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }

      #drill_controls {
        position: absolute;
        bottom: 48px;
        left: 4px;
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 0;
        font-size: 12px;
        text-shadow: 1px 1px 0 black;
      }

      #seed {
        width: 10ch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
